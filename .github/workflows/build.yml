name: rtc native build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight static verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - name: Verify source quality, contracts, and scripts
        run: |
          php -n scripts/quality.php
          php -n tests/contract/check.php
          if git rev-parse --verify --quiet HEAD^ >/dev/null; then
            git diff --check HEAD^..HEAD -- ':!build/patches/*.patch'
          else
            git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD -- ':!build/patches/*.patch'
          fi
          for file in scripts/*.sh tests/build/*.sh; do
            [[ -f "$file" ]] || continue
            bash -n "$file"
          done

  linux:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1.34', '8.4.24']
        mode: [nts, zts]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Cache locked re2c package
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: .build/re2c
          key: rtc-re2c-${{ runner.os }}-${{ hashFiles('build/dependencies.lock.json') }}
      - name: Cache official PHP source tarball
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: .build/php-${{ matrix.php }}.tar.xz
          key: rtc-php-tarball-${{ matrix.php }}-${{ hashFiles('scripts/build-php.sh') }}
      - name: Prepare locked PHP parser tool
        shell: bash
        run: |
          bash scripts/prepare-re2c-linux.sh
          echo "$PWD/.build/re2c/root/usr/bin" >> "$GITHUB_PATH"
      - name: Build isolated PHP and OpenSSL
        shell: bash
        run: |
          bash scripts/build-php.sh '${{ matrix.php }}' '${{ matrix.mode }}'
          bash scripts/build-openssl.sh
      - name: Build real module
        shell: bash
        run: |
          export PKG_CONFIG_PATH="$PWD/.build/openssl/lib/pkgconfig"
          php="$PWD/.build/php-${{ matrix.php }}-${{ matrix.mode }}/install/bin"
          bash scripts/build-linux.sh --php "$php/php" --php-config "$php/php-config" --phpize "$php/phpize" --build-dir "$PWD/.build/rtc"
          bash tests/build/missing-backend.sh "$php/php" "$php/php-config" "$php/phpize" "$PWD/.build/rtc/install"
          python3 tests/build/backend-patches.py "$PWD/.build/patch-tests" "$PWD/.build/rtc/libdatachannel"
      - name: PHPT and lifecycle
        shell: bash
        run: bash scripts/test-linux.sh "$PWD/.build/php-${{ matrix.php }}-${{ matrix.mode }}/install/bin/php" "$PWD/.build/rtc"
      - name: Native ASan and UBSan
        if: matrix.php == '8.4.24' && matrix.mode == 'nts'
        shell: bash
        env:
          PKG_CONFIG_PATH: '${{ github.workspace }}/.build/openssl/lib/pkgconfig'
        run: bash scripts/test-sanitizers-linux.sh "$PWD/.build/rtc" 2>&1 | tee .build/rtc/logs/sanitizers.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rtc-linux-${{ matrix.php }}-${{ matrix.mode }}
          include-hidden-files: true
          retention-days: 14
          path: |
            .build/rtc/extension/modules/rtc.so
            .build/rtc/install/lib/*.so*
            .build/rtc/logs/
            .build/rtc/sanitized-native/Testing/Temporary/
            .build/rtc/install/share/rtc/
            .build/openssl/lib/*.so*
            .build/php-${{ matrix.php }}-${{ matrix.mode }}/configure.log
            .build/php-${{ matrix.php }}-${{ matrix.mode }}/make.log
            tests/*.diff
            tests/*.out

  windows:
    needs: preflight
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1.34', '8.4.24']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build PHP, pinned native dependencies, and php_rtc.dll
        shell: pwsh
        env:
          TARGET_PHP: '${{ matrix.php }}'
        run: |
          ./scripts/build-windows.ps1 -PhpVersion $env:TARGET_PHP -BuildDirectory "$PWD/.build/windows/$env:TARGET_PHP"
      - name: PHPT and lifecycle
        shell: pwsh
        env:
          TARGET_PHP: '${{ matrix.php }}'
        run: |
          ./scripts/test-windows.ps1 -PhpVersion $env:TARGET_PHP -BuildDirectory "$PWD/.build/windows/$env:TARGET_PHP"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rtc-windows-${{ matrix.php }}-zts
          include-hidden-files: true
          retention-days: 14
          path: |
            .build/windows/${{ matrix.php }}/build-complete.json
            .build/windows/${{ matrix.php }}/php-abi.json
            .build/windows/${{ matrix.php }}/toolchain.json
            .build/windows/${{ matrix.php }}/selected-toolset.txt
            .build/windows/${{ matrix.php }}/backend/CMakeCache.txt
            .build/windows/${{ matrix.php }}/logs/
            .build/windows/${{ matrix.php }}/source/php-src/x64/Release_TS/**/php_rtc.dll
            .build/windows/${{ matrix.php }}/source/php-src/x64/Release_TS/datachannel.dll
            .build/windows/${{ matrix.php }}/source/php-src/x64/Release_TS/libcrypto-3-x64.dll
            .build/windows/${{ matrix.php }}/source/php-src/x64/Release_TS/libssl-3-x64.dll
            .build/windows/${{ matrix.php }}/notices/
            tests/*.diff
            tests/*.out
